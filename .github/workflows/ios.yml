name: iOS shell

# Builds the Capacitor iOS project in mobile/ios for real iPhones, unsigned,
# and keeps it as a downloadable .ipa. Sideloadly (free Apple ID) or Xcode
# signs it at install time; see mobile/README.md. Runs when mobile/ios
# changes, or by hand from Actions.
on:
  pull_request:
    paths: ["mobile/ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile/ios
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx cap sync ios
      - run: >
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release
          -sdk iphoneos -destination "generic/platform=iOS" -derivedDataPath build
          CODE_SIGNING_ALLOWED=NO build
      - run: mkdir Payload && cp -R build/Build/Products/Release-iphoneos/App.app Payload/ && zip -qr golf-ai-coach-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: golf-ai-coach-unsigned-ipa
          path: mobile/ios/golf-ai-coach-unsigned.ipa
